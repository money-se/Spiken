name: Publicera Spiken på GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta koden
        uses: actions/checkout@v4
      - name: Installera Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Konfigurera GitHub Pages
        uses: actions/configure-pages@v5
      - name: Installera beroenden
        run: npm install
      - name: Installera Spikens bildpaket
        run: |
          mkdir -p public/images
          if [ -f Spiken_2_0_Bildpaket.zip ]; then
            unzip -o -j Spiken_2_0_Bildpaket.zip '*.webp' -d public/images
            echo "Spiken 2.0-bilder installerade."
          elif [ -f Spiken_Under_Huden_Bildpaket_Komplett.zip ]; then
            unzip -o -j Spiken_Under_Huden_Bildpaket_Komplett.zip '*.webp' -d public/images
            echo "Komplett bildpaket installerat."
          elif [ -f Spiken_Under_Huden_Bildpaket.zip ]; then
            unzip -o -j Spiken_Under_Huden_Bildpaket.zip '*.webp' -d public/images
            echo "Äldre bildpaket installerat. Ladda upp Komplett.zip för de nya bilderna."
          else
            echo "Inget bildpaket hittades."
          fi
      - name: Installera genomgående bakgrundsbild
        run: |
          if [ -f Spiken_Helbakgrund.zip ]; then
            unzip -o -j Spiken_Helbakgrund.zip 'spiken-helbakgrund.webp' -d public/images
            echo "Ny helbakgrund installerad."
          else
            echo "Spiken_Helbakgrund.zip saknas. Reservbilden används tills den laddas upp."
          fi
      - name: Installera Spiken 3.0-bilder
        run: |
          if [ -f Spiken_3_0_Bildpaket.zip ]; then
            unzip -o -j Spiken_3_0_Bildpaket.zip '*.webp' -d public/images
            echo "Spiken 3.0: hero och författarporträtt installerade."
          else
            echo "Spiken_3_0_Bildpaket.zip saknas ännu. Tidigare bilder visas som reserv."
          fi
      - name: Installera unika diktbilder
        run: |
          shopt -s nullglob
          for archive in Spiken_Diktbilder_*.zip; do
            unzip -o -j "$archive" '*.webp' -d public/images
            echo "Diktbilder från $archive installerade."
          done
      - name: Installera unik bild för diktarkivet
        run: |
          if [ -f Spiken_Arkivbild_001.zip ]; then
            unzip -o -j Spiken_Arkivbild_001.zip '*.webp' -d public/images
            echo "Arkivbild installerad."
          else
            echo "Arkivbild saknas, reservbilden används."
          fi
      - name: Installera specialskapad Om Spiken-bild
        run: |
          if [ -f Spiken_Om_Bildpaket_002.zip ]; then
            unzip -o -j Spiken_Om_Bildpaket_002.zip '*.webp' -d public/images
            echo "Om Spiken: sovrumsbild för test installerad."
          elif [ -f Spiken_Om_Bildpaket_001.zip ]; then
            unzip -o -j Spiken_Om_Bildpaket_001.zip '*.webp' -d public/images
            echo "Om Spiken: tidigare bild installerad."
          else
            echo "Om Spiken-bild saknas, befintligt porträtt visas som reserv."
          fi
      - name: Installera Tankens hav på Spikens världar
        run: |
          if [ -f Spiken_Varldar_Bildpaket_001.zip ]; then
            unzip -o -j Spiken_Varldar_Bildpaket_001.zip 'spiken-varldar-tankens-hav.webp' -d public/images
            echo "Tankens hav installerat."
          else
            echo "Bildpaketet för Spikens världar saknas ännu."
          fi
      - name: Bygg webbplatsen
        run: npm run build
      - name: Ladda upp webbplatsen
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicera
        id: deployment
        uses: actions/deploy-pages@v4
