name: Publicera Spiken på GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta koden
        uses: actions/checkout@v4
      - name: Installera Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Konfigurera GitHub Pages
        uses: actions/configure-pages@v5
      - name: Installera beroenden
        run: npm install
      - name: Installera Spikens bildpaket
        run: |
          mkdir -p public/images
          if [ -f Spiken_2_0_Bildpaket.zip ]; then
            unzip -o -j Spiken_2_0_Bildpaket.zip '*.webp' -d public/images
            echo "Spiken 2.0-bilder installerade."
          elif [ -f Spiken_Under_Huden_Bildpaket_Komplett.zip ]; then
            unzip -o -j Spiken_Under_Huden_Bildpaket_Komplett.zip '*.webp' -d public/images
            echo "Komplett bildpaket installerat."
          elif [ -f Spiken_Under_Huden_Bildpaket.zip ]; then
            unzip -o -j Spiken_Under_Huden_Bildpaket.zip '*.webp' -d public/images
            echo "Äldre bildpaket installerat. Ladda upp Komplett.zip för de nya bilderna."
          else
            echo "Inget bildpaket hittades."
          fi
      - name: Installera genomgående bakgrundsbild
        run: |
          if [ -f Spiken_Helbakgrund.zip ]; then
            unzip -o -j Spiken_Helbakgrund.zip 'spiken-helbakgrund.webp' -d public/images
            echo "Ny helbakgrund installerad."
          else
            echo "Spiken_Helbakgrund.zip saknas. Reservbilden används tills den laddas upp."
          fi
      - name: Installera Spiken 3.0-bilder
        run: |
          if [ -f Spiken_3_0_Bildpaket.zip ]; then
            unzip -o -j Spiken_3_0_Bildpaket.zip '*.webp' -d public/images
            echo "Spiken 3.0: hero och författarporträtt installerade."
          else
            echo "Spiken_3_0_Bildpaket.zip saknas ännu. Tidigare bilder visas som reserv."
          fi
      - name: Installera unika diktbilder
        run: |
          set -euo pipefail
          shopt -s nullglob
          for archive in Spiken_Diktbilder_*.zip; do
            unzip -o -j "$archive" '*.webp' -d public/images
            echo "Diktbilder från $archive installerade."
          done
          # Dessa tre motiv är godkända i bildpaket 003: ingen äldre version får vinna.
          if [ ! -f Spiken_Diktbilder_003.zip ]; then
            echo "::error::Godkänt bildpaket 003 saknas."
            exit 1
          fi
          # Versionsmärkta filnamn löser bildcache på tidigare använda URL:er.
          for photo in dikt-i-din-sotma.webp dikt-under-ditt-sken.webp dikt-vid-brytgransen-mellan-tid-och-rum.webp; do
            new_photo="${photo%.webp}-20261118.webp"
            unzip -p Spiken_Diktbilder_003.zip "$photo" > "public/images/$new_photo"
            unzip -p Spiken_Diktbilder_003.zip "$photo" | cmp - "public/images/$new_photo" || {
              echo "::error::$new_photo matchar inte godkänt bildpaket 003."
              exit 1
            }
            echo "Verifierat nytt publicerat motiv från paket 003: $new_photo"
          done
      - name: Kontrollera bildpaket 004 och diktbilderna
        run: |
          set -euo pipefail
          test -f Spiken_Diktbilder_004_KOMPLETT.zip
          for photo in \
            dikt-i-kraften-av-det-lilla.webp \
            dikt-djavulens-symfoni.webp \
            dikt-smartan-vaxer.webp \
            dikt-kampen-emot-tiden.webp \
            dikt-i-skogens-hjarta.webp \
            dikt-min-lilla-flicka-mitt-hjarta.webp \
            dikt-bakom-mitt-leende.webp \
            dikt-antligen-fri.webp; do
            unzip -p Spiken_Diktbilder_004_KOMPLETT.zip "$photo" | cmp - "public/images/$photo" || {
              echo "::error::Bildfilen $photo saknas eller skiljer sig från godkänt ZIP-paket 004."
              exit 1
            }
            echo "Godkänd diktbild: $photo"
          done
      - name: Kontrollera bildpaket 005 och diktbilderna
        run: |
          set -euo pipefail
          test -f Spiken_Diktbilder_005_KOMPLETT.zip
          for photo in \
            dikt-slutet-ar-nara.webp \
            dikt-hostregnets-eko.webp \
            dikt-le-vi-alla-borde-le-lite-mer.webp \
            dikt-evig-vantan.webp \
            dikt-i-skenet-av-manens-nakna-visioner.webp \
            dikt-dropp-dropp.webp \
            dikt-i-bilens-varme.webp \
            dikt-blodets-skapelse.webp \
            dikt-i-klangens-blomsterhav.webp \
            dikt-filmen-inom-mig.webp; do
            unzip -p Spiken_Diktbilder_005_KOMPLETT.zip "$photo" | cmp - "public/images/$photo" || {
              echo "::error::$photo skiljer sig från paket 005 eller saknas."
              exit 1
            }
            echo "Verifierad bild från 005: $photo"
          done
      - name: Kontrollera bildpaket 006 och sista tre diktbilderna
        run: |
          set -euo pipefail
          test -f Spiken_Diktbilder_006_FOR_GRANSKNING.zip
          for photo in \
            dikt-silvret-och-kronan.webp \
            dikt-forankrad-i-verkligheten.webp \
            dikt-rosten-i-musiken.webp; do
            unzip -p Spiken_Diktbilder_006_FOR_GRANSKNING.zip "$photo" | cmp - "public/images/$photo" || {
              echo "::error::$photo saknas eller skiljer sig från godkänt bildpaket 006."
              exit 1
            }
            echo "Verifierad bild från 006: $photo"
          done
      - name: Installera unik bild för diktarkivet
        run: |
          if [ -f Spiken_Arkivbild_001.zip ]; then
            unzip -o -j Spiken_Arkivbild_001.zip '*.webp' -d public/images
            echo "Arkivbild installerad."
          else
            echo "Arkivbild saknas, reservbilden används."
          fi
      - name: Installera specialskapad Om Spiken-bild
        run: |
          if [ -f Spiken_Om_Bildpaket_002.zip ]; then
            unzip -o -j Spiken_Om_Bildpaket_002.zip '*.webp' -d public/images
            echo "Om Spiken: sovrumsbild för test installerad."
          elif [ -f Spiken_Om_Bildpaket_001.zip ]; then
            unzip -o -j Spiken_Om_Bildpaket_001.zip '*.webp' -d public/images
            echo "Om Spiken: tidigare bild installerad."
          else
            echo "Om Spiken-bild saknas, befintligt porträtt visas som reserv."
          fi
      - name: Installera Tankens hav på Spikens världar
        run: |
          if [ -f Spiken_Varldar_Bildpaket_001.zip ]; then
            unzip -o -j Spiken_Varldar_Bildpaket_001.zip 'spiken-varldar-tankens-hav.webp' -d public/images
            echo "Tankens hav installerat."
          else
            echo "Bildpaketet för Spikens världar saknas ännu."
          fi
      - name: Mät referensbildens faktiska format och storlek
        run: |
          if [ -f public/images/dikt-mannen-bakom-masken.webp ]; then
            file public/images/dikt-mannen-bakom-masken.webp
            wc -c < public/images/dikt-mannen-bakom-masken.webp
            python3 - <<'PY'
          from pathlib import Path
          import struct
          p=Path('public/images/dikt-mannen-bakom-masken.webp')
          b=p.read_bytes()
          assert b[:4]==b'RIFF' and b[8:12]==b'WEBP'
          kind=b[12:16]
          if kind==b'VP8X':
              w=1+int.from_bytes(b[24:27],'little'); h=1+int.from_bytes(b[27:30],'little')
          elif kind==b'VP8L':
              value=int.from_bytes(b[21:25],'little')
              w=(value&0x3fff)+1; h=((value>>14)&0x3fff)+1
          elif kind==b'VP8 ':
              w=struct.unpack_from('<H',b,26)[0]&0x3fff
              h=struct.unpack_from('<H',b,28)[0]&0x3fff
          else: raise ValueError('Unknown WebP format '+repr(kind))
          print(f'REFERENSBILD: {w} x {h} pixlar, {len(b)} byte, format {kind.decode().strip()}')
          PY
          fi
      - name: Kontrollera diktimporten
        run: |
          node --check scripts/importera-dikter.mjs
          npm run test:import
          npm run dikter:kontrollera
          npm run dikter:validera
      - name: Bygg webbplatsen
        run: npm run build
      - name: Verifiera publicerade diktsidor och bilder
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { readFileSync, existsSync } from 'node:fs';
          const reg=JSON.parse(readFileSync('src/data/publiceringsregister.json','utf8'));
          let count=0;
          for(const work of reg.works){
            if(work.type!=='dikt')continue;
            for(const [lang,t] of Object.entries(work.translations||{})){
              if(t?.status!=='published')continue;
              const rel=lang==='sv'?'dikter/':'en/poems/';
              const page='dist/'+rel+t.slug+'/index.html';
              if(!existsSync(page))throw Error('Publicerad dikt saknar HTML: '+page);
              if(work.image?.path){
                const photo='dist/images/'+work.image.path.replace(/^[/]+/, '');
                if(!existsSync(photo))throw Error('Publicerad dikt saknar bild: '+photo);
              }
              count++;
            }
          }
          console.log('Verifierade publicerade diktsidor:',count);
          JS
      - name: Ladda upp webbplatsen
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicera
        id: deployment
        uses: actions/deploy-pages@v4
